<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HIS 생기부 번역 시스템</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Bebas+Neue&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy: #0a1628;
    --navy2: #112240;
    --teal: #00b4a6;
    --teal2: #00d4c8;
    --gold: #f5a623;
    --white: #f0f4f8;
    --gray: #8892a4;
    --error: #e74c3c;
  }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--navy);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* 배경 패턴 */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 50%, rgba(0,180,166,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 20%, rgba(245,166,35,0.06) 0%, transparent 40%);
    pointer-events: none;
  }

  .grid-bg {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,180,166,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,180,166,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .login-wrap {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 420px;
    padding: 20px;
    animation: fadeUp 0.6s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .school-badge {
    text-align: center;
    margin-bottom: 32px;
  }

  .school-badge .his {
    font-family: 'Bebas Neue', cursive;
    font-size: 56px;
    letter-spacing: 4px;
    color: var(--teal);
    line-height: 1;
  }

  .school-badge .subtitle {
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--gray);
    text-transform: uppercase;
    margin-top: 4px;
  }

  .card {
    background: var(--navy2);
    border: 1px solid rgba(0,180,166,0.2);
    border-radius: 16px;
    padding: 36px 32px;
    box-shadow: 0 24px 64px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.03);
  }

  .card-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--white);
    margin-bottom: 4px;
  }

  .card-sub {
    font-size: 12px;
    color: var(--gray);
    margin-bottom: 28px;
  }

  .field {
    margin-bottom: 16px;
  }

  .field label {
    display: block;
    font-size: 11px;
    font-weight: 500;
    color: var(--teal);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .field input {
    width: 100%;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    color: var(--white);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    padding: 12px 14px;
    transition: border-color 0.2s, background 0.2s;
    outline: none;
  }

  .field input:focus {
    border-color: var(--teal);
    background: rgba(0,180,166,0.06);
  }

  .field input::placeholder { color: rgba(255,255,255,0.2); }

  .btn-login {
    width: 100%;
    background: var(--teal);
    color: var(--navy);
    border: none;
    border-radius: 8px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    font-weight: 700;
    padding: 13px;
    cursor: pointer;
    margin-top: 8px;
    transition: background 0.2s, transform 0.1s;
    letter-spacing: 0.5px;
  }

  .btn-login:hover { background: var(--teal2); }
  .btn-login:active { transform: scale(0.98); }
  .btn-login:disabled { background: var(--gray); cursor: not-allowed; }

  .error-msg {
    margin-top: 12px;
    padding: 10px 12px;
    background: rgba(231,76,60,0.1);
    border: 1px solid rgba(231,76,60,0.3);
    border-radius: 6px;
    color: #e74c3c;
    font-size: 12px;
    text-align: center;
    display: none;
  }

  .divider {
    height: 1px;
    background: rgba(255,255,255,0.06);
    margin: 24px 0;
  }

  .note {
    text-align: center;
    font-size: 11px;
    color: var(--gray);
    line-height: 1.6;
  }
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="login-wrap">
  <div class="school-badge">
    <div class="his">HIS</div>
    <div class="subtitle">Handong International School</div>
  </div>
  <div class="card">
    <div class="card-title">생기부 번역 시스템</div>
    <div class="card-sub">School Record Translation System</div>

    <div class="field">
      <label>이름 / Name</label>
      <input type="text" id="name" placeholder="예: Henry / 홍길동" autocomplete="username">
    </div>
    <div class="field">
      <label>비밀번호 / Password</label>
      <input type="password" id="password" placeholder="휴대폰 뒷 4자리" autocomplete="current-password">
    </div>

    <button class="btn-login" id="loginBtn" onclick="doLogin()">
      로그인 / Login
    </button>

    <div class="error-msg" id="errorMsg"></div>

    <div class="divider"></div>
    <div class="note">
      비밀번호는 휴대폰 번호 뒷 4자리입니다.<br>
      Password is the last 4 digits of your phone number.
    </div>
  </div>
</div>

<script>
  // Enter 키 로그인
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doLogin();
  });

  function doLogin() {
    var name = document.getElementById('name').value.trim();
    var pw = document.getElementById('password').value.trim();
    var btn = document.getElementById('loginBtn');
    var err = document.getElementById('errorMsg');

    if (!name || !pw) {
      showError('이름과 비밀번호를 입력하세요.\nPlease enter name and password.');
      return;
    }

    btn.disabled = true;
    btn.textContent = '로그인 중... / Logging in...';
    err.style.display = 'none';

    google.script.run
      .withSuccessHandler(function(res) {
        if (res.success) {
          localStorage.setItem('his_token', res.token);
          localStorage.setItem('his_teacher', JSON.stringify(res.teacher));
          // GAS Web App URL에 token 파라미터로 이동
          google.script.run
            .withSuccessHandler(function(url) {
              // 기존 URL에서 exec 부분까지만 사용
              var baseUrl = url.split('?')[0];
              window.location.href = baseUrl + '?token=' + res.token;
            })
            .getScriptUrl();
        } else {
          showError(res.error);
          btn.disabled = false;
          btn.textContent = '로그인 / Login';
        }
      })
      .withFailureHandler(function(e) {
        showError('서버 오류: ' + e.message);
        btn.disabled = false;
        btn.textContent = '로그인 / Login';
      })
      .apiLogin(name, pw);
  }

  function showError(msg) {
    var err = document.getElementById('errorMsg');
    err.textContent = msg;
    err.style.display = 'block';
  }
</script>
</body>
</html>

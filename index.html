<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HIS 생기부 번역 시스템</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Bebas+Neue&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy:    #0a1628;
    --navy2:   #112240;
    --navy3:   #1a2e4a;
    --teal:    #00b4a6;
    --teal2:   #00d4c8;
    --gold:    #f5a623;
    --red:     #e74c3c;
    --green:   #27ae60;
    --white:   #f0f4f8;
    --gray:    #8892a4;
    --gray2:   #4a5568;
    --border:  rgba(255,255,255,0.07);
    --hover:   rgba(0,180,166,0.06);
    --sidebar-w: 220px;
    --header-h:  52px;
    --toolbar-h: 110px;
  }

  html, body { height: 100%; overflow: hidden; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--navy);
    color: var(--white);
    font-size: 13px;
  }

  /* ── 헤더 ── */
  #header {
    position: fixed; top: 0; left: 0; right: 0;
    height: var(--header-h);
    background: var(--navy2);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center;
    padding: 0 16px;
    z-index: 100;
    gap: 12px;
  }

  .logo {
    font-family: 'Bebas Neue', cursive;
    font-size: 26px;
    color: var(--teal);
    letter-spacing: 2px;
    white-space: nowrap;
  }

  .logo-sub { font-size: 10px; color: var(--gray); letter-spacing: 1px; }

  .header-sep { width: 1px; height: 24px; background: var(--border); margin: 0 4px; }

  .header-nav { display: flex; gap: 2px; }

  .nav-btn {
    background: none; border: none; color: var(--gray);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 12px; padding: 6px 12px; cursor: pointer;
    border-radius: 6px; transition: all 0.15s;
    white-space: nowrap;
  }

  .nav-btn:hover { background: var(--hover); color: var(--white); }
  .nav-btn.active { background: rgba(0,180,166,0.15); color: var(--teal); font-weight: 500; }

  .header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

  .teacher-badge {
    font-size: 11px; color: var(--gray);
    background: rgba(255,255,255,0.05);
    border-radius: 20px; padding: 4px 10px;
  }

  .teacher-badge span { color: var(--teal); font-weight: 500; }

  .role-badge {
    font-size: 10px; padding: 3px 8px; border-radius: 4px;
    font-weight: 700; letter-spacing: 0.5px;
  }

  .role-번역  { background: rgba(0,180,166,0.2); color: var(--teal); }
  .role-검수  { background: rgba(245,166,35,0.2); color: var(--gold); }
  .role-관리자 { background: rgba(231,76,60,0.2); color: var(--red); }
  .role-일반  { background: rgba(136,146,164,0.2); color: var(--gray); }

  .btn-logout {
    background: none; border: 1px solid var(--border);
    color: var(--gray); font-size: 11px; padding: 5px 10px;
    border-radius: 6px; cursor: pointer; transition: all 0.15s;
    font-family: 'Noto Sans KR', sans-serif;
  }

  .btn-logout:hover { border-color: var(--red); color: var(--red); }

  /* ── 툴바 ── */
  #toolbar {
    position: fixed;
    top: var(--header-h); left: 0; right: 0;
    height: var(--toolbar-h);
    background: var(--navy2);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px 8px;
    z-index: 90;
    display: flex; flex-direction: column; gap: 8px;
  }

  .toolbar-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  .ctrl-group { display: flex; align-items: center; gap: 6px; }

  .ctrl-label {
    font-size: 10px; color: var(--gray);
    letter-spacing: 0.5px; white-space: nowrap;
  }

  select, .ctrl-select {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--white);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 12px;
    padding: 5px 8px;
    border-radius: 6px;
    cursor: pointer;
    outline: none;
    transition: border-color 0.15s;
  }

  select:focus { border-color: var(--teal); }
  select option { background: var(--navy2); }

  .subject-select {
    background: rgba(0,180,166,0.1);
    border-color: rgba(0,180,166,0.3);
    color: var(--teal);
    font-weight: 500;
    font-size: 13px;
    max-width: 300px;
  }

  .creativity-wrap { display: flex; align-items: center; gap: 6px; }

  input[type=range] {
    -webkit-appearance: none;
    width: 80px; height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px; cursor: pointer;
  }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px; height: 12px;
    background: var(--teal);
    border-radius: 50%;
  }

  .creativity-val { font-size: 11px; color: var(--teal); min-width: 24px; }

  .btn-icon {
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    color: var(--gray);
    font-size: 11px; padding: 5px 10px;
    border-radius: 6px; cursor: pointer;
    transition: all 0.15s;
    font-family: 'Noto Sans KR', sans-serif;
    white-space: nowrap;
  }

  .btn-icon:hover { background: var(--hover); color: var(--teal); border-color: var(--teal); }

  .btn-teal {
    background: var(--teal); color: var(--navy);
    border: none; font-family: 'Noto Sans KR', sans-serif;
    font-size: 12px; font-weight: 700;
    padding: 6px 14px; border-radius: 6px;
    cursor: pointer; transition: background 0.15s;
    white-space: nowrap;
  }

  .btn-teal:hover { background: var(--teal2); }

  .prompt-row {
    display: flex; align-items: center; gap: 8px;
  }

  .prompt-input {
    flex: 1;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--white);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 11px;
    padding: 5px 10px;
    border-radius: 6px;
    outline: none;
    transition: border-color 0.15s;
  }

  .prompt-input:focus { border-color: var(--teal); }
  .prompt-input::placeholder { color: rgba(255,255,255,0.2); }

  /* ── 탭 ── */
  .tabs {
    position: fixed;
    top: calc(var(--header-h) + var(--toolbar-h));
    left: 0; right: 0;
    height: 36px;
    background: var(--navy2);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: flex-end;
    padding: 0 16px;
    z-index: 80;
  }

  .tab {
    padding: 8px 16px;
    font-size: 12px;
    cursor: pointer;
    border-radius: 6px 6px 0 0;
    color: var(--gray);
    border: 1px solid transparent;
    border-bottom: none;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .tab.active {
    background: var(--navy);
    border-color: var(--border);
    color: var(--white);
    font-weight: 500;
  }

  .tab:hover:not(.active) { color: var(--white); }

  /* ── 메인 테이블 영역 ── */
  #main {
    position: fixed;
    top: calc(var(--header-h) + var(--toolbar-h) + 36px);
    left: 0; right: 0; bottom: 0;
    overflow: auto;
  }

  /* ── 스프레드시트 테이블 ── */
  .sheet-table {
    width: max-content;
    min-width: 100%;
    border-collapse: collapse;
  }

  .sheet-table thead th {
    position: sticky; top: 0; z-index: 10;
    background: var(--navy3);
    border: 1px solid var(--border);
    padding: 8px 10px;
    font-size: 11px;
    font-weight: 600;
    color: var(--gray);
    text-align: center;
    white-space: nowrap;
    letter-spacing: 0.3px;
  }

  .sheet-table thead th.col-source { color: var(--gold); }
  .sheet-table thead th.col-trans  { color: var(--teal); }
  .sheet-table thead th.col-final  { color: var(--green); }

  .sheet-table tbody tr {
    transition: background 0.1s;
  }

  .sheet-table tbody tr:hover { background: var(--hover); }

  .sheet-table tbody td {
    border: 1px solid var(--border);
    padding: 0;
    vertical-align: top;
  }

  /* 고정 정보 셀 */
  .cell-info {
    padding: 8px 10px;
    white-space: nowrap;
    color: var(--white);
    font-size: 12px;
    text-align: center;
    min-width: 60px;
  }

  .cell-neis { font-size: 11px; color: var(--teal); font-weight: 500; }

  /* 텍스트 입력 셀 */
  .cell-textarea {
    width: 100%; min-height: 80px;
    background: transparent;
    border: none; outline: none;
    color: var(--white);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 12px;
    line-height: 1.6;
    padding: 8px 10px;
    resize: none;
    display: block;
  }

  .cell-textarea:focus { background: rgba(0,180,166,0.04); }

  .cell-textarea.source { min-width: 280px; }
  .cell-textarea.draft  { min-width: 260px; background: rgba(0,180,166,0.02); }
  .cell-textarea.final  { min-width: 260px; background: rgba(39,174,96,0.02); }
  .cell-textarea.comment { min-width: 160px; font-size: 11px; color: var(--gray); }

  /* 번역 버튼 셀 */
  .cell-action {
    padding: 8px;
    text-align: center;
    vertical-align: middle;
    min-width: 80px;
  }

  .btn-translate {
    background: var(--teal); color: var(--navy);
    border: none; border-radius: 4px;
    font-size: 11px; font-weight: 700;
    padding: 5px 10px; cursor: pointer;
    transition: background 0.15s;
    font-family: 'Noto Sans KR', sans-serif;
    width: 100%;
    margin-bottom: 4px;
  }

  .btn-translate:hover { background: var(--teal2); }
  .btn-translate:disabled { background: var(--gray2); color: var(--gray); cursor: not-allowed; }

  .btn-copy {
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    color: var(--gray); border-radius: 4px;
    font-size: 10px; padding: 3px 6px;
    cursor: pointer; transition: all 0.15s;
    font-family: 'Noto Sans KR', sans-serif;
    width: 100%;
  }

  .btn-copy:hover { color: var(--white); border-color: rgba(255,255,255,0.2); }

  /* 글자수 */
  .char-count {
    font-size: 10px; padding: 4px 8px;
    text-align: right; white-space: nowrap;
    min-width: 60px;
  }

  .char-ok   { color: var(--green); }
  .char-warn { color: var(--gold); }
  .char-over { color: var(--red); font-weight: 700; }

  /* 상태 */
  .status-badge {
    display: inline-block;
    font-size: 10px; padding: 2px 7px;
    border-radius: 3px; font-weight: 600;
  }

  .status-draft    { background: rgba(136,146,164,0.2); color: var(--gray); }
  .status-reviewed { background: rgba(245,166,35,0.2);  color: var(--gold); }
  .status-final    { background: rgba(39,174,96,0.2);   color: var(--green); }

  /* NEIS 경고 */
  .neis-warn {
    font-size: 10px; color: var(--gold);
    padding: 2px 6px; border-top: 1px solid var(--border);
    background: rgba(245,166,35,0.05);
    line-height: 1.5;
  }

  /* ── 로딩 오버레이 ── */
  #loading {
    position: fixed; inset: 0;
    background: rgba(10,22,40,0.9);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 999;
  }

  .spinner {
    width: 40px; height: 40px;
    border: 3px solid rgba(0,180,166,0.2);
    border-top-color: var(--teal);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 16px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-text { color: var(--gray); font-size: 13px; }

  /* ── 토스트 ── */
  #toast {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--navy3);
    border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 16px;
    font-size: 12px; color: var(--white);
    z-index: 999; opacity: 0;
    transition: opacity 0.3s;
    max-width: 300px;
  }

  #toast.show { opacity: 1; }
  #toast.success { border-color: var(--teal); }
  #toast.error   { border-color: var(--red); color: var(--red); }

  /* ── 빈 상태 ── */
  .empty-state {
    padding: 80px 20px;
    text-align: center;
    color: var(--gray);
  }

  .empty-state .icon { font-size: 40px; margin-bottom: 16px; opacity: 0.4; }
  .empty-state p { font-size: 13px; line-height: 1.8; }

  /* ── 모달 (프롬프트/설정) ── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 500;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s;
  }

  .modal-overlay.open { opacity: 1; pointer-events: all; }

  .modal {
    background: var(--navy2);
    border: 1px solid rgba(0,180,166,0.3);
    border-radius: 12px; padding: 24px;
    min-width: 480px; max-width: 680px; width: 90%;
    max-height: 80vh; overflow-y: auto;
  }

  .modal h3 { font-size: 15px; margin-bottom: 16px; color: var(--white); }

  .modal-close {
    float: right; background: none; border: none;
    color: var(--gray); font-size: 18px; cursor: pointer;
    line-height: 1;
  }

  .form-row { margin-bottom: 14px; }
  .form-label { font-size: 11px; color: var(--teal); margin-bottom: 6px; display: block; letter-spacing: 0.5px; }

  .form-input, .form-textarea, .form-select {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--white);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 12px; padding: 8px 10px;
    border-radius: 6px; outline: none;
    transition: border-color 0.15s;
  }

  .form-input:focus, .form-textarea:focus, .form-select:focus { border-color: var(--teal); }
  .form-textarea { min-height: 100px; resize: vertical; }
  .form-select option { background: var(--navy2); }

  .modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }

  .btn-save {
    background: var(--teal); color: var(--navy);
    border: none; border-radius: 6px;
    font-size: 12px; font-weight: 700;
    padding: 8px 20px; cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
  }

  .btn-cancel {
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    color: var(--gray); border-radius: 6px;
    font-size: 12px; padding: 8px 20px;
    cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
  }

  /* 스크롤바 */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
</style>
</head>
<body>

<!-- 로딩 -->
<div id="loading">
  <div class="spinner"></div>
  <div class="loading-text">불러오는 중... / Loading...</div>
</div>

<!-- 헤더 -->
<div id="header">
  <div>
    <div class="logo">HIS</div>
    <div class="logo-sub">생기부 번역</div>
  </div>
  <div class="header-sep"></div>
  <div class="header-nav">
    <button class="nav-btn active" onclick="setView('translate')">번역 / Translate</button>
    <button class="nav-btn" onclick="setView('review')" id="navReview">검수 / Review</button>
    <button class="nav-btn" onclick="setView('admin')" id="navAdmin" style="display:none">관리 / Admin</button>
  </div>
  <div class="header-right">
    <div class="teacher-badge">
      <span id="teacherName">-</span>
    </div>
    <div class="role-badge" id="roleBadge">-</div>
    <button class="btn-logout" onclick="doLogout()">로그아웃</button>
  </div>
</div>

<!-- 툴바 -->
<div id="toolbar">
  <div class="toolbar-row">
    <!-- 학년도/학기 -->
    <div class="ctrl-group">
      <span class="ctrl-label">학년도 Year</span>
      <select id="selYear" onchange="onFilterChange()"></select>
    </div>
    <div class="ctrl-group">
      <span class="ctrl-label">학기 Sem.</span>
      <select id="selSem" onchange="onFilterChange()">
        <option value="1">1학기</option>
        <option value="2">2학기</option>
      </select>
    </div>
    <div class="ctrl-group">
      <span class="ctrl-label">학년 Grade</span>
      <select id="selGrade" onchange="onFilterChange()">
        <option value="">전체</option>
        <option value="7">7</option><option value="8">8</option>
        <option value="9">9</option><option value="10">10</option>
        <option value="11">11</option><option value="12">12</option>
      </select>
    </div>
    <!-- 과목 선택 -->
    <div class="ctrl-group">
      <select id="selSubject" class="subject-select" onchange="onSubjectChange()">
        <option value="">-- 과목/동아리 선택 --</option>
      </select>
    </div>
    <div class="header-sep"></div>
    <!-- 번역 설정 -->
    <div class="ctrl-group">
      <span class="ctrl-label">Source</span>
      <select id="selSrcLang">
        <option value="English">English</option>
        <option value="Korean">Korean</option>
      </select>
    </div>
    <div class="ctrl-group">
      <span class="ctrl-label">→ Target</span>
      <select id="selTgtLang">
        <option value="Korean">Korean</option>
        <option value="English">English</option>
      </select>
    </div>
    <div class="ctrl-group">
      <span class="ctrl-label">Engine</span>
      <select id="selEngine" onchange="onEngineChange()">
        <option value="gpt">GPT</option>
        <option value="claude">Claude</option>
      </select>
    </div>
    <div class="ctrl-group">
      <span class="ctrl-label">Model</span>
      <select id="selModel"></select>
    </div>
    <div class="ctrl-group creativity-wrap">
      <span class="ctrl-label">Creativity</span>
      <input type="range" id="sliderCreativity" min="0.1" max="0.9" step="0.1" value="0.5"
        oninput="document.getElementById('valCreativity').textContent=this.value">
      <span class="creativity-val" id="valCreativity">0.5</span>
    </div>
    <button class="btn-icon" onclick="openPromptModal()">✏️ 프롬프트</button>
    <button class="btn-teal" onclick="translateAll()">▶ 전체 번역</button>
  </div>
</div>

<!-- 탭 -->
<div class="tabs" id="tabBar">
  <div class="tab active" onclick="switchTab('과목')" id="tab과목">📚 과목 / Courses</div>
  <div class="tab" onclick="switchTab('동아리')" id="tab동아리">🎭 동아리 / Clubs</div>
</div>

<!-- 메인 -->
<div id="main">
  <div id="viewTranslate">
    <table class="sheet-table" id="mainTable">
      <thead id="tableHead"></thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div class="empty-state" id="emptyState">
      <div class="icon">📋</div>
      <p>과목 또는 동아리를 선택하세요.<br>Select a subject or club to begin.</p>
    </div>
  </div>

  <div id="viewReview" style="display:none">
    <table class="sheet-table" id="reviewTable">
      <thead id="reviewHead"></thead>
      <tbody id="reviewBody"></tbody>
    </table>
    <div class="empty-state" id="reviewEmpty">
      <div class="icon">🔍</div>
      <p>검수할 항목이 없습니다.<br>No items to review.</p>
    </div>
  </div>

  <div id="viewAdmin" style="display:none">
    <!-- 관리자 뷰는 별도 렌더링 -->
  </div>
</div>

<!-- 토스트 -->
<div id="toast"></div>

<!-- 프롬프트 모달 -->
<div class="modal-overlay" id="promptModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('promptModal')">×</button>
    <h3>✏️ 번역 프롬프트 / Translation Prompt</h3>
    <div class="form-row">
      <label class="form-label">시스템 프롬프트 (비워두면 기본 프롬프트 사용)</label>
      <textarea class="form-textarea" id="promptText" rows="6"
        placeholder="예: You are an expert Korean school record translator. Translate accurately using formal educational Korean terminology..."></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal('promptModal')">취소 / Cancel</button>
      <button class="btn-save" onclick="savePrompt()">저장 / Save</button>
    </div>
  </div>
</div>

<!-- 관리자 설정 모달 -->
<div class="modal-overlay" id="adminModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('adminModal')">×</button>
    <h3>⚙️ API 키 설정 / API Key Settings</h3>
    <div class="form-row">
      <label class="form-label">OpenAI API Key</label>
      <input type="password" class="form-input" id="openaiKey" placeholder="sk-...">
    </div>
    <div class="form-row">
      <label class="form-label">Anthropic API Key</label>
      <input type="password" class="form-input" id="anthropicKey" placeholder="sk-ant-...">
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal('adminModal')">취소</button>
      <button class="btn-save" onclick="saveApiKeys()">저장</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// 앱 상태
// ============================================================
var APP = {
  token: '',
  teacher: null,
  currentTab: '과목',
  currentView: 'translate',
  subjects: [],        // 현재 탭 과목 목록
  selectedSubject: null,
  students: [],        // 현재 수강 학생
  rows: [],            // 테이블 행 데이터
  prompt: '',
  models: { gpt: ['gpt-4o','gpt-4o-mini','gpt-4-turbo','gpt-3.5-turbo'],
            claude: ['claude-opus-4-6','claude-sonnet-4-6','claude-haiku-4-5-20251001'] }
};

// ============================================================
// 초기화
// ============================================================
window.onload = function() {
  var token = getUrlParam('token') || localStorage.getItem('his_token');
  var teacherStr = localStorage.getItem('his_teacher');

  if (!token) { redirectLogin(); return; }

  APP.token = token;

  // 교사 정보 확인
  google.script.run
    .withSuccessHandler(function(teacher) {
      if (!teacher) { redirectLogin(); return; }
      APP.teacher = teacher;
      localStorage.setItem('his_token', token);
      localStorage.setItem('his_teacher', JSON.stringify(teacher));
      initUI();
    })
    .withFailureHandler(function() { redirectLogin(); })
    .apiGetMe(token);
};

function initUI() {
  var t = APP.teacher;

  document.getElementById('teacherName').textContent = t.name + ' / ' + t.fullName;
  var rb = document.getElementById('roleBadge');
  rb.textContent = t.role;
  rb.className = 'role-badge role-' + t.role;

  // 관리자 메뉴
  if (t.role === '관리자') {
    document.getElementById('navAdmin').style.display = '';
  }

  // 학년도 옵션
  var yearSel = document.getElementById('selYear');
  var now = new Date();
  var curYear = now.getFullYear();
  for (var y = curYear; y >= curYear - 3; y--) {
    var opt = document.createElement('option');
    opt.value = y; opt.textContent = y;
    yearSel.appendChild(opt);
  }

  // 학기 기본값
  var month = now.getMonth() + 1;
  document.getElementById('selSem').value = month <= 7 ? '1' : '2';

  // 모델 초기화
  onEngineChange();

  // 담당 과목 로드
  loadSubjects();

  hideLoading();
}

function loadSubjects() {
  var sem = document.getElementById('selSem').value;
  showLoading('과목 불러오는 중...');

  google.script.run
    .withSuccessHandler(function(res) {
      hideLoading();
      if (!res.success) { toast('과목 로드 실패: ' + res.error, 'error'); return; }

      APP.subjects = res.data;
      renderSubjectSelect();
    })
    .withFailureHandler(function(e) {
      hideLoading();
      toast('오류: ' + e.message, 'error');
    })
    .apiGetMySubjects(APP.token, sem);
}

function renderSubjectSelect() {
  var sel = document.getElementById('selSubject');
  var tab = APP.currentTab;
  var grade = document.getElementById('selGrade').value;

  var filtered = APP.subjects.filter(function(s) {
    if (s.type !== tab) return false;
    if (grade && String(s.grade) !== grade) return false;
    return true;
  });

  sel.innerHTML = '<option value="">-- ' + (tab === '과목' ? '과목 선택 Select Subject' : '동아리 선택 Select Club') + ' --</option>';

  filtered.forEach(function(s) {
    var opt = document.createElement('option');
    opt.value = s.subjectCode;
    opt.textContent = s.nameKR + ' / ' + s.nameEN + ' (G' + s.grade + ')';
    opt.dataset.subject = JSON.stringify(s);
    sel.appendChild(opt);
  });
}

function onSubjectChange() {
  var sel = document.getElementById('selSubject');
  var opt = sel.options[sel.selectedIndex];
  if (!opt || !opt.dataset.subject) {
    APP.selectedSubject = null;
    renderEmptyTable();
    return;
  }

  APP.selectedSubject = JSON.parse(opt.dataset.subject);
  loadStudentsForSubject(APP.selectedSubject.subjectCode);
}

function loadStudentsForSubject(subjectCode) {
  showLoading('학생 목록 불러오는 중...');

  google.script.run
    .withSuccessHandler(function(res) {
      hideLoading();
      if (!res.success) { toast('학생 로드 실패: ' + res.error, 'error'); return; }

      APP.students = res.data;
      APP.rows = res.data.map(function(s) {
        return {
          student: s,
          sourceText: '',
          translatedDraft: '',
          finalText: '',
          comment: '',
          status: 'draft',
          charCount: 0,
          rowIndex: null,
          translating: false
        };
      });

      renderTable();
    })
    .withFailureHandler(function(e) {
      hideLoading();
      toast('오류: ' + e.message, 'error');
    })
    .apiGetStudentsByCourse(APP.token, subjectCode);
}

// ============================================================
// 테이블 렌더링
// ============================================================
function renderTable() {
  var head = document.getElementById('tableHead');
  var body = document.getElementById('tableBody');
  var empty = document.getElementById('emptyState');
  var table = document.getElementById('mainTable');

  if (!APP.rows || APP.rows.length === 0) {
    table.style.display = 'none';
    empty.style.display = 'block';
    return;
  }

  table.style.display = '';
  empty.style.display = 'none';

  var role = APP.teacher.role;

  head.innerHTML = '<tr>' +
    '<th style="min-width:100px">Name (EN)</th>' +
    '<th style="min-width:80px">이름</th>' +
    '<th>Grade</th><th>Class</th>' +
    '<th class="cell-neis">NEIS</th>' +
    '<th class="col-source" style="min-width:280px">Source (원문)</th>' +
    '<th style="min-width:80px">번역</th>' +
    '<th class="col-trans" style="min-width:260px">번역 초본 Draft</th>' +
    (role !== '번역' ? '<th class="col-final" style="min-width:260px">최종본 Final</th>' : '') +
    (role !== '번역' ? '<th style="min-width:140px">검수 코멘트</th>' : '') +
    '<th>글자수</th>' +
    '<th>상태</th>' +
    '</tr>';

  body.innerHTML = APP.rows.map(function(row, i) {
    return renderRow(row, i, role);
  }).join('');
}

function renderRow(row, i, role) {
  var s = row.student;
  var cc = row.finalText ? row.finalText.length : (row.translatedDraft ? row.translatedDraft.length : 0);
  var ccClass = cc === 0 ? '' : cc > 500 ? 'char-over' : cc > 450 ? 'char-warn' : 'char-ok';
  var statusHtml = '<span class="status-badge status-' + row.status + '">' + row.status + '</span>';

  return '<tr id="row_' + i + '">' +
    '<td><div class="cell-info">' + (s.engName||'-') + '</div></td>' +
    '<td><div class="cell-info">' + s.name + '</div></td>' +
    '<td><div class="cell-info">' + s.grade + '</div></td>' +
    '<td><div class="cell-info">' + s.class + '</div></td>' +
    '<td><div class="cell-info cell-neis">' + (s.neisClass||'') + '</div></td>' +
    '<td><textarea class="cell-textarea source" oninput="onSourceChange(' + i + ', this.value)" ' +
      (role === '검수' ? 'readonly' : '') + '>' + esc(row.sourceText) + '</textarea></td>' +
    '<td class="cell-action">' +
      '<button class="btn-translate" onclick="translateRow(' + i + ')" ' +
        (row.translating ? 'disabled' : '') + '>' +
        (row.translating ? '...' : '번역') +
      '</button>' +
      '<button class="btn-copy" onclick="copyText(' + i + ', \'draft\')">복사</button>' +
    '</td>' +
    '<td><textarea class="cell-textarea draft" oninput="onDraftChange(' + i + ', this.value)" ' +
      (role === '번역' ? 'readonly' : '') + '>' + esc(row.translatedDraft) + '</textarea></td>' +
    (role !== '번역' ?
      '<td><textarea class="cell-textarea final" oninput="onFinalChange(' + i + ', this.value)">' +
        esc(row.finalText) + '</textarea>' +
        '<div class="cell-action" style="padding:4px">' +
          '<button class="btn-copy" onclick="copyText(' + i + ', \'final\')">NEIS 복사</button>' +
          '<button class="btn-icon" style="margin-top:4px;font-size:10px;width:100%" onclick="checkNeis(' + i + ')">NEIS 검토</button>' +
        '</div>' +
      '</td>' : '') +
    (role !== '번역' ?
      '<td><textarea class="cell-textarea comment" oninput="onCommentChange(' + i + ', this.value)">' +
        esc(row.comment) + '</textarea></td>' : '') +
    '<td><div class="char-count ' + ccClass + '">' + (cc > 0 ? cc + '/500' : '-') + '</div></td>' +
    '<td><div class="cell-info">' + statusHtml + '<br>' +
      '<button class="btn-icon" style="margin-top:4px;font-size:10px" onclick="saveRow(' + i + ')">저장</button>' +
    '</div></td>' +
    '</tr>';
}

function renderEmptyTable() {
  document.getElementById('mainTable').style.display = 'none';
  document.getElementById('emptyState').style.display = 'block';
}

// ============================================================
// 이벤트 핸들러
// ============================================================
function onSourceChange(i, val) { APP.rows[i].sourceText = val; }
function onDraftChange(i, val)  { APP.rows[i].translatedDraft = val; updateCharCount(i); }
function onFinalChange(i, val)  { APP.rows[i].finalText = val; updateCharCount(i); }
function onCommentChange(i, val){ APP.rows[i].comment = val; }

function updateCharCount(i) {
  var row = APP.rows[i];
  var text = row.finalText || row.translatedDraft || '';
  var cc = text.length;
  row.charCount = cc;
  var ccClass = cc === 0 ? '' : cc > 500 ? 'char-over' : cc > 450 ? 'char-warn' : 'char-ok';
  var el = document.querySelector('#row_' + i + ' .char-count');
  if (el) { el.textContent = cc > 0 ? cc + '/500' : '-'; el.className = 'char-count ' + ccClass; }
}

function onFilterChange() { loadSubjects(); }

function switchTab(tab) {
  APP.currentTab = tab;
  document.getElementById('tab과목').className = 'tab' + (tab === '과목' ? ' active' : '');
  document.getElementById('tab동아리').className = 'tab' + (tab === '동아리' ? ' active' : '');
  renderSubjectSelect();
  renderEmptyTable();
}

function onEngineChange() {
  var engine = document.getElementById('selEngine').value;
  var sel = document.getElementById('selModel');
  sel.innerHTML = APP.models[engine].map(function(m) {
    return '<option value="' + m + '">' + m + '</option>';
  }).join('');
}

function setView(view) {
  APP.currentView = view;
  document.getElementById('viewTranslate').style.display = view === 'translate' ? '' : 'none';
  document.getElementById('viewReview').style.display = view === 'review' ? '' : 'none';
  document.getElementById('viewAdmin').style.display = view === 'admin' ? '' : 'none';

  document.querySelectorAll('.nav-btn').forEach(function(b) { b.classList.remove('active'); });
  event.target.classList.add('active');

  if (view === 'review') loadReviewList();
  if (view === 'admin') renderAdminView();
}

// ============================================================
// 번역
// ============================================================
function getTranslatePayload(row) {
  return {
    engine: document.getElementById('selEngine').value,
    model: document.getElementById('selModel').value,
    creativity: parseFloat(document.getElementById('sliderCreativity').value),
    prompt: APP.prompt,
    sourceLang: document.getElementById('selSrcLang').value,
    targetLang: document.getElementById('selTgtLang').value,
    text: row.sourceText,
    studentName: row.student.name + ' / ' + row.student.engName,
    subjectName: APP.selectedSubject ? (APP.selectedSubject.nameKR + ' / ' + APP.selectedSubject.nameEN) : ''
  };
}

function translateRow(i) {
  var row = APP.rows[i];
  if (!row.sourceText.trim()) { toast('원문을 입력하세요.', 'error'); return; }

  row.translating = true;
  var btn = document.querySelector('#row_' + i + ' .btn-translate');
  if (btn) { btn.disabled = true; btn.textContent = '번역 중...'; }

  google.script.run
    .withSuccessHandler(function(res) {
      row.translating = false;
      if (!res.success) { toast('번역 실패: ' + res.error, 'error'); refreshRow(i); return; }
      row.translatedDraft = res.text;
      if (!row.finalText) row.finalText = res.text;
      refreshRow(i);
      toast('번역 완료 ✓', 'success');
    })
    .withFailureHandler(function(e) {
      row.translating = false;
      refreshRow(i);
      toast('오류: ' + e.message, 'error');
    })
    .apiTranslate(APP.token, getTranslatePayload(row));
}

function translateAll() {
  var pending = APP.rows.filter(function(r) { return r.sourceText.trim() && !r.translatedDraft; });
  if (pending.length === 0) { toast('번역할 항목이 없습니다.', 'error'); return; }

  var idx = APP.rows.indexOf(pending[0]);
  translateNext(pending, 0);
}

function translateNext(pending, idx) {
  if (idx >= pending.length) { toast('전체 번역 완료 ✓', 'success'); return; }
  var row = pending[idx];
  var i = APP.rows.indexOf(row);
  row.translating = true;
  refreshRow(i);

  google.script.run
    .withSuccessHandler(function(res) {
      row.translating = false;
      if (res.success) {
        row.translatedDraft = res.text;
        if (!row.finalText) row.finalText = res.text;
      }
      refreshRow(i);
      translateNext(pending, idx + 1);
    })
    .withFailureHandler(function() {
      row.translating = false;
      refreshRow(i);
      translateNext(pending, idx + 1);
    })
    .apiTranslate(APP.token, getTranslatePayload(row));
}

function refreshRow(i) {
  var role = APP.teacher.role;
  var tr = document.getElementById('row_' + i);
  if (tr) {
    var tmp = document.createElement('tbody');
    tmp.innerHTML = renderRow(APP.rows[i], i, role);
    tr.parentNode.replaceChild(tmp.firstChild, tr);
    // ID 재설정
    tmp.firstChild && (tmp.firstChild.id = 'row_' + i);
  }
}

// ============================================================
// 저장
// ============================================================
function saveRow(i) {
  var row = APP.rows[i];
  var s = APP.selectedSubject;
  if (!s) { toast('과목을 선택하세요.', 'error'); return; }

  var record = {
    year: document.getElementById('selYear').value,
    semester: document.getElementById('selSem').value,
    type: APP.currentTab,
    subjectCode: s.subjectCode,
    subjectNameKR: s.nameKR,
    subjectNameEN: s.nameEN,
    studentName: row.student.name,
    studentNameEN: row.student.engName,
    grade: row.student.grade,
    class: row.student.class,
    neisClass: row.student.neisClass,
    neisNo: row.student.neisNo,
    sourceLang: document.getElementById('selSrcLang').value,
    targetLang: document.getElementById('selTgtLang').value,
    model: document.getElementById('selModel').value,
    creativity: document.getElementById('sliderCreativity').value,
    prompt: APP.prompt,
    sourceText: row.sourceText,
    translatedDraft: row.translatedDraft
  };

  google.script.run
    .withSuccessHandler(function(res) {
      if (!res.success) { toast('저장 실패: ' + res.error, 'error'); return; }
      row.rowIndex = res.rowIndex;
      toast('저장 완료 ✓', 'success');
    })
    .withFailureHandler(function(e) { toast('저장 오류: ' + e.message, 'error'); })
    .apiSaveTrans(APP.token, record);
}

// ============================================================
// NEIS 검토
// ============================================================
function checkNeis(i) {
  var row = APP.rows[i];
  var text = row.finalText || row.translatedDraft;
  if (!text) { toast('검토할 텍스트가 없습니다.', 'error'); return; }

  google.script.run
    .withSuccessHandler(function(res) {
      if (!res.success) return;
      var d = res.data;
      var msgs = d.warnings.length > 0 ? d.warnings.join('\n') : '✓ 이상 없음';
      alert('[NEIS 검토 결과]\n글자수: ' + d.charCount + '/500\n\n' + msgs);
    })
    .withFailureHandler(function(e) { toast('검토 오류: ' + e.message, 'error'); })
    .apiNeisValidate(APP.token, text);
}

// ============================================================
// 검수 뷰
// ============================================================
function loadReviewList() {
  showLoading('검수 목록 불러오는 중...');
  var filters = {
    year: document.getElementById('selYear').value,
    semester: document.getElementById('selSem').value
  };

  google.script.run
    .withSuccessHandler(function(res) {
      hideLoading();
      if (!res.success) { toast('로드 실패', 'error'); return; }
      renderReviewTable(res.data);
    })
    .withFailureHandler(function(e) { hideLoading(); toast(e.message, 'error'); })
    .apiGetTransList(APP.token, filters);
}

function renderReviewTable(data) {
  var head = document.getElementById('reviewHead');
  var body = document.getElementById('reviewBody');
  var empty = document.getElementById('reviewEmpty');

  if (!data || data.length === 0) {
    document.getElementById('reviewTable').style.display = 'none';
    empty.style.display = 'block';
    return;
  }

  document.getElementById('reviewTable').style.display = '';
  empty.style.display = 'none';

  head.innerHTML = '<tr>' +
    '<th>학생</th><th>영문명</th><th>Grade</th><th>과목</th>' +
    '<th style="min-width:240px">번역 초본</th>' +
    '<th style="min-width:240px">최종본</th>' +
    '<th style="min-width:140px">코멘트</th>' +
    '<th>글자수</th><th>상태</th><th>작업</th>' +
    '</tr>';

  body.innerHTML = data.map(function(r) {
    var cc = (r.finalText || r.reviewedText || r.translatedDraft || '').length;
    var ccClass = cc > 500 ? 'char-over' : cc > 450 ? 'char-warn' : 'char-ok';
    return '<tr>' +
      '<td><div class="cell-info">' + r.studentName + '</div></td>' +
      '<td><div class="cell-info">' + r.studentNameEN + '</div></td>' +
      '<td><div class="cell-info">' + r.grade + '</div></td>' +
      '<td><div class="cell-info" style="font-size:11px">' + r.subjectNameKR + '</div></td>' +
      '<td><textarea class="cell-textarea draft" id="rv_draft_' + r.rowIndex + '">' + esc(r.translatedDraft) + '</textarea></td>' +
      '<td><textarea class="cell-textarea final" id="rv_final_' + r.rowIndex + '">' + esc(r.finalText) + '</textarea></td>' +
      '<td><textarea class="cell-textarea comment" id="rv_cmt_' + r.rowIndex + '">' + esc(r.reviewerComment) + '</textarea></td>' +
      '<td><div class="char-count ' + ccClass + '">' + cc + '/500</div></td>' +
      '<td><div class="cell-info"><span class="status-badge status-' + r.status + '">' + r.status + '</span></div></td>' +
      '<td class="cell-action">' +
        '<button class="btn-translate" onclick="saveReview(' + r.rowIndex + ')">저장</button>' +
        '<button class="btn-copy" onclick="copyReview(' + r.rowIndex + ')">NEIS복사</button>' +
      '</td>' +
      '</tr>';
  }).join('');
}

function saveReview(rowIndex) {
  var finalEl = document.getElementById('rv_final_' + rowIndex);
  var cmtEl = document.getElementById('rv_cmt_' + rowIndex);

  var fields = {
    finalText: finalEl ? finalEl.value : '',
    reviewerComment: cmtEl ? cmtEl.value : '',
    status: 'reviewed'
  };

  google.script.run
    .withSuccessHandler(function(res) {
      if (res.success) toast('검수 저장 완료 ✓', 'success');
      else toast('저장 실패: ' + res.error, 'error');
    })
    .withFailureHandler(function(e) { toast(e.message, 'error'); })
    .apiUpdateTrans(APP.token, rowIndex, fields);
}

function copyReview(rowIndex) {
  var el = document.getElementById('rv_final_' + rowIndex);
  if (!el || !el.value) { toast('최종본이 없습니다.', 'error'); return; }
  copyToClipboard(el.value);
  toast('클립보드에 복사되었습니다 ✓', 'success');
}

// ============================================================
// 관리자 뷰
// ============================================================
function renderAdminView() {
  var view = document.getElementById('viewAdmin');
  view.innerHTML = '<div style="padding:20px">' +
    '<button class="btn-teal" onclick="openAdminModal()" style="margin-right:8px">🔑 API 키 설정</button>' +
    '<button class="btn-icon" onclick="loadTeacherAdmin()">👥 교사 권한 관리</button>' +
    '<div id="teacherAdminList" style="margin-top:20px"></div>' +
    '</div>';
}

function loadTeacherAdmin() {
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res.success) { toast('로드 실패', 'error'); return; }
      var html = '<table class="sheet-table">' +
        '<thead><tr><th>이름</th><th>Full Name</th><th>이메일</th><th>홈룸</th><th>현재 권한</th><th>변경</th></tr></thead><tbody>' +
        res.data.map(function(t) {
          return '<tr>' +
            '<td><div class="cell-info">' + t.name + '</div></td>' +
            '<td><div class="cell-info">' + t.fullName + '</div></td>' +
            '<td><div class="cell-info" style="font-size:11px">' + t.email + '</div></td>' +
            '<td><div class="cell-info">' + t.homeroom + '</div></td>' +
            '<td><div class="cell-info"><span class="role-badge role-' + t.role + '">' + t.role + '</span></div></td>' +
            '<td class="cell-action">' +
              '<select id="role_' + t.name + '" class="ctrl-select" style="margin-bottom:4px">' +
                ['번역','검수','관리자','일반'].map(function(r) {
                  return '<option value="' + r + '"' + (r === t.role ? ' selected' : '') + '>' + r + '</option>';
                }).join('') +
              '</select>' +
              '<button class="btn-translate" onclick="changeRole(\'' + t.name + '\')">변경</button>' +
            '</td>' +
            '</tr>';
        }).join('') +
        '</tbody></table>';
      document.getElementById('teacherAdminList').innerHTML = html;
    })
    .withFailureHandler(function(e) { toast(e.message, 'error'); })
    .apiGetTeachers(APP.token);
}

function changeRole(name) {
  var sel = document.getElementById('role_' + name);
  var role = sel.value;
  google.script.run
    .withSuccessHandler(function(res) {
      if (res.success) toast(name + ' 권한 변경 완료 ✓', 'success');
      else toast('변경 실패: ' + res.error, 'error');
    })
    .withFailureHandler(function(e) { toast(e.message, 'error'); })
    .apiUpdateTeacherRole(APP.token, name, role);
}

function openAdminModal() { document.getElementById('adminModal').classList.add('open'); }

function saveApiKeys() {
  var oai = document.getElementById('openaiKey').value;
  var ant = document.getElementById('anthropicKey').value;
  google.script.run
    .withSuccessHandler(function(res) {
      if (res.success) { toast('API 키 저장 완료 ✓', 'success'); closeModal('adminModal'); }
      else toast('저장 실패: ' + res.error, 'error');
    })
    .withFailureHandler(function(e) { toast(e.message, 'error'); })
    .apiSaveApiKeys(APP.token, oai, ant);
}

// ============================================================
// 유틸
// ============================================================
function copyText(i, type) {
  var text = type === 'final' ? (APP.rows[i].finalText || APP.rows[i].translatedDraft) : APP.rows[i].translatedDraft;
  if (!text) { toast('복사할 텍스트가 없습니다.', 'error'); return; }
  copyToClipboard(text);
  toast('클립보드에 복사되었습니다 ✓', 'success');
}

function copyToClipboard(text) {
  var ta = document.createElement('textarea');
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
}

function openPromptModal() {
  document.getElementById('promptText').value = APP.prompt;
  document.getElementById('promptModal').classList.add('open');
}

function savePrompt() {
  APP.prompt = document.getElementById('promptText').value;
  closeModal('promptModal');
  toast('프롬프트 저장 완료 ✓', 'success');
}

function closeModal(id) { document.getElementById(id).classList.remove('open'); }

function showLoading(msg) {
  document.getElementById('loading').style.display = 'flex';
  var lt = document.querySelector('.loading-text');
  if (lt) lt.textContent = msg || '불러오는 중...';
}

function hideLoading() { document.getElementById('loading').style.display = 'none'; }

var toastTimer;
function toast(msg, type) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show ' + (type || '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { el.className = ''; }, 3000);
}

function esc(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function getUrlParam(name) {
  var u = new URL(window.location.href);
  return u.searchParams.get(name);
}

function getScriptUrl() {
  return new Promise(function(resolve) {
    google.script.run
      .withSuccessHandler(resolve)
      .getScriptUrl();
  });
}

function redirectLogin() {
  google.script.run
    .withSuccessHandler(function(url) { window.location.href = url + '?page=login'; })
    .getScriptUrl();
}

function doLogout() {
  google.script.run
    .withSuccessHandler(function() {
      localStorage.removeItem('his_token');
      localStorage.removeItem('his_teacher');
      redirectLogin();
    })
    .apiLogout(APP.token);
}
